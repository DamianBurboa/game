<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué tanto me conoces? · Cartas para parejas</title>
<style>
:root{--bg1:#1a0b2e;--bg2:#3b1348;--rose:#ff5d8f;--gold:#ffc872;--ink:#fff;--muted:#d8c6e8;--card:#fff7f2;--cardink:#2a1038;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg1) 70%);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;text-align:center;gap:18px}
h1{font-family:Georgia,"Playfair Display",serif;font-size:clamp(1.9rem,6vw,3rem);margin:0;line-height:1.1}
h1 span{color:var(--rose)}
p.sub{margin:0;color:var(--muted);max-width:420px;font-size:1rem;line-height:1.5}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{border:0;cursor:pointer;font:600 1rem inherit;font-family:inherit;color:#fff;padding:16px 26px;border-radius:18px;background:linear-gradient(135deg,var(--rose),#c13584);box-shadow:0 10px 30px rgba(255,93,143,.35);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.alt{background:linear-gradient(135deg,#6a5cff,#3a8dff);box-shadow:0 10px 30px rgba(58,141,255,.35)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;padding:10px 18px;font-size:.9rem}
.top{width:min(88vw,360px);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.bar{width:min(88vw,360px);height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));width:0;transition:width .4s}
.stack{position:relative;width:min(80vw,340px);aspect-ratio:3/4.2;max-height:62vh;perspective:1200px;margin:6px 0}
.ghost-card{position:absolute;inset:0;border-radius:24px;background:linear-gradient(145deg,#5a2275,#2d1046);border:1px solid rgba(255,255,255,.15)}
.g1{transform:translateY(8px) scale(.97) rotate(2deg)}
.g2{transform:translateY(16px) scale(.94) rotate(-2deg);opacity:.7}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.8,.3,1);cursor:pointer;animation:in .4s ease}
.card.flipped{transform:rotateY(180deg)}
.card.out{transition:transform .45s ease,opacity .45s;transform:translate(130%,-10%) rotate(22deg);opacity:0}
@keyframes in{from{transform:translateY(-30px) scale(.95);opacity:0}}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),linear-gradient(145deg,var(--rose),#7b2cbf);border:3px solid rgba(255,255,255,.4)}
.back .heart{font-size:5rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.back small{margin-top:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.9}
.front{background:var(--card);color:var(--cardink);transform:rotateY(180deg);border:3px solid var(--gold)}
.front .tag{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:#c13584;font-weight:700;margin-bottom:14px}
.front .q{font-family:Georgia,serif;font-size:clamp(1.15rem,4.6vw,1.5rem);line-height:1.35;font-weight:700}
.front .n{position:absolute;bottom:16px;font-size:.8rem;opacity:.55}
.hint{color:var(--muted);font-size:.85rem;min-height:1.2em}
.btn[disabled]{opacity:.35;pointer-events:none}
@media (min-width:700px){.stack{width:360px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q={
hombre:[
"¿Qué harías si tu pareja estuviera a punto de pelearse con alguien? ¿Y qué haría ella si fueras tú?",
"¿En qué situaciones estás de acuerdo en que ella lo resuelva a su manera, sin que tú intervengas?",
"¿Cuál crees que es el miedo más grande que ella nunca te ha dicho en voz alta?",
"¿Qué herida de su infancia crees que todavía influye en cómo ama hoy?",
"Si le ofrecieran el trabajo de sus sueños en otro país, ¿qué crees que respondería de inmediato?",
"¿Cómo te das cuenta de que está enojada cuando dice «no pasa nada»?",
"¿Cuál es la fantasía que sabes que ella tiene y que todavía no se ha cumplido?",
"¿Qué cosa que haces le molesta más de lo que admite?",
"¿Qué necesita escuchar de ti cuando se siente insegura?",
"Si ganaran un millón de pesos hoy, ¿en qué lo gastaría primero y en qué NO te diría?",
"¿Quién la ha decepcionado más en la vida y cómo lo ha manejado?",
"¿Qué sueño abandonó que todavía le duele un poquito?",
"Si descubre que le mentiste en algo «pequeño», ¿cómo reaccionaría?",
"¿Qué cosa cree ella que jamás podría perdonar?",
"¿Qué parte de su personalidad o de su cuerpo le da más inseguridad?",
"Cuando está triste o enferma, ¿prefiere espacio o compañía? ¿Y cómo lo pide sin pedirlo?",
"¿Cuál crees que fue el momento más difícil de la relación para ella?",
"¿Qué le diría a su yo de hace diez años sobre el amor?",
"¿Con qué familiar tuyo se siente realmente incómoda, aunque lo disimule?",
"Si te ve discutiendo fuerte con un amigo, ¿se mete o espera a que termines?",
"¿Qué canción la hace llorar y por qué?",
"¿Qué es lo que más admira de ti y casi nunca te dice?",
"¿Cuál es su límite no negociable en la relación?",
"¿Cómo imagina su vida en diez años y estás tú en ese cuadro tal como eres hoy?",
"Si pudiera pedirte un solo cambio sin que te ofendas, ¿cuál sería?"],
mujer:[
"¿Qué harías si tu pareja estuviera a punto de pelearse con alguien? ¿Y qué haría él si fueras tú?",
"¿En qué situaciones estás de acuerdo en que él lo resuelva a su manera, sin que tú intervengas?",
"¿Cuál crees que es el miedo más grande que él nunca te ha dicho en voz alta?",
"¿Qué cosa de su infancia crees que todavía pesa en la forma en que te quiere?",
"Si le ofrecieran el trabajo de sus sueños lejos de ti, ¿qué crees que respondería de inmediato?",
"¿Cómo te das cuenta de que está mal cuando dice «estoy bien»?",
"¿Cuál es la fantasía que sabes que él tiene y que todavía no se ha cumplido?",
"¿Qué hábito tuyo le molesta más de lo que se atreve a decirte?",
"¿Qué necesita sentir de ti cuando está bajo mucho estrés?",
"Si ganaran un millón de pesos hoy, ¿en qué lo gastaría primero y en qué NO te diría?",
"¿Qué amistad o familiar lo ha decepcionado más y cómo lo lleva?",
"¿Qué meta o sueño dejó a medias y todavía le duele?",
"Si descubre que le ocultaste algo «sin importancia», ¿cómo reaccionaría?",
"¿Qué cosa cree él que jamás podría perdonar?",
"¿Qué parte de sí mismo es la que más intenta esconder?",
"Cuando se siente derrotado, ¿quiere que lo animes o que simplemente te quedes a su lado?",
"¿Cuál crees que fue el momento más difícil de la relación para él?",
"¿Qué consejo le daría a su yo de hace diez años sobre el amor?",
"¿Con qué familiar o amiga tuya se siente realmente incómodo, aunque no lo diga?",
"Si te ve llorando por una pelea con alguien, ¿qué hace primero: te abraza, te escucha o va a resolverlo?",
"¿Qué canción o recuerdo lo vuelve sentimental y por qué?",
"¿Qué es lo que más admira de ti y casi nunca te dice?",
"¿Cuál es su límite no negociable en la relación?",
"¿Cómo imagina su vida en diez años y estás tú en ese cuadro tal como eres hoy?",
"Si pudiera pedirte un solo cambio sin que te ofendas, ¿cuál sería?"]};
const app=document.getElementById('app');
let deck=[],i=0,who='',flipped=false,busy=false;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function home(){
 app.innerHTML=`<div style="font-size:3rem">💘</div><h1>¿Qué tanto <span>me conoces</span>?</h1>
 <p class="sub">Un juego de cartas para parejas. Elige quién va a responder: las preguntas son sobre tu pareja. Volteen cada carta, respondan con honestidad y comparen.</p>
 <div class="choices"><button class="btn alt" data-g="hombre">Soy hombre</button><button class="btn" data-g="mujer">Soy mujer</button></div>
 <p class="hint">25 cartas · sin prisas · sin mentiras 😉</p>`;
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>start(b.dataset.g));
}
function start(g){who=g;deck=shuffle(Q[g]);i=0;draw()}
function draw(front){
 flipped=!!front;busy=false;
 const n=deck.length;
 app.innerHTML=`<div class="top"><span>Carta ${i+1} de ${n}</span><button class="btn ghost" id="bk">← Inicio</button></div>
 <div class="bar"><i style="width:${(i/n)*100}%"></i></div>
 <div class="stack"><div class="ghost-card g2"></div><div class="ghost-card g1"></div>
 <div class="card${front?' flipped':''}" id="c"><div class="face back"><div class="heart">💞</div><small>Toca para voltear</small></div>
 <div class="face front"><div class="tag">Sobre ${who==='hombre'?'ella':'él'}</div><div class="q">${deck[i]}</div><div class="n">${i+1} / ${n}</div></div></div></div>
 <div class="hint" id="h">${front?'Respondan y toca otra vez para pasar a la siguiente':'Toca la carta'}</div>
 <button class="btn ghost" id="bc" ${i===0?'disabled':''}>← Atrás</button>`;
 document.getElementById('bk').onclick=home;
 document.getElementById('c').onclick=tap;
 document.getElementById('bc').onclick=()=>{if(busy||i===0)return;i--;draw(true)};
}
function tap(){
 if(busy)return;const c=document.getElementById('c'),h=document.getElementById('h');
 if(!flipped){flipped=true;c.classList.add('flipped');h.textContent='Respondan y toca otra vez para pasar a la siguiente';return}
 busy=true;c.classList.add('out');
 setTimeout(()=>{i++;i>=deck.length?end():draw()},420);
}
function end(){
 app.innerHTML=`<div style="font-size:3.4rem">🎉</div><h1>¡Se acabó la baraja!</h1>
 <p class="sub">¿Cuántas acertaron? Lo importante es lo que descubrieron del otro. Ahora cambien de turno o vuelvan a barajar.</p>
 <div class="choices"><button class="btn" id="r">Barajar de nuevo</button><button class="btn alt" id="s">Cambiar de jugador</button></div>`;
 document.getElementById('r').onclick=()=>start(who);
 document.getElementById('s').onclick=()=>start(who==='hombre'?'mujer':'hombre');
}
home();
</script>
</body>
</html>
